[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-algorithms"
version = "0.3.0"
description = "Optimization portfolio: energy markets (PCR/Euphemia), LP/MIP, backtesting — hexagonal architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "GerryBerry"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pulp>=3.0",
    "yfinance>=0.2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.15",
    "ruff>=0.8",
]
live = [
    "requests>=2.28",
]
docs = ["sphinx>=7.0"]

[project.scripts]
ea-markets = "energy_algorithms.application.markets_demo:main"
ea-optimization = "energy_algorithms.application.optimization_demo:main"
ea-trading = "energy_algorithms.application.trading_demo:main"
ea-live = "energy_algorithms.application.live_pipeline:demo_live_pipeline"
ea-europe = "energy_algorithms.application.european_coupling:main"
ea-history = "energy_algorithms.application.historical_analysis:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=energy_algorithms --cov-fail-under=80"
markers = [
    "slow: slow tests (>5s solve time) — run only on PC",
    "pc: PC-only tests (requires >1GB RAM, >1GHz CPU)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["energy_algorithms"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "scripts/"]
