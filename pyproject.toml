[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-algorithms"
version = "0.2.0"
description = "Optimization portfolio: energy markets (PCR/Euphemia), LP/MIP, backtesting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "GerryBerry"},
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pulp>=3.0",
    "yfinance>=0.2.30",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["energy_markets*", "lp_optimization*", "backtester*", "strategies*", "market_data*", "energy_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: slow tests (>5s solve time) — run only on PC",
    "pc: PC-only tests (requires >1GB RAM, >1GHz CPU)",
]
